# Gateway-only gate: advisories and native-TLS bans over the gateway subgraph.
# The gateway is a workspace member with the single root Cargo.lock, so this
# file runs with the gateway as the sole graph root:
#   cargo deny --locked --manifest-path src-tauri/companion/Cargo.toml \
#     --config src-tauri/companion/deny.toml check advisories bans
# The root deny.toml covers every member (licenses, sources, advisories with
# the app's exceptions); none of those app exceptions applies here, and the
# app's aws-lc-rs (through russh) stays out of these bans.
# Only the two reviewed exceptions below may be ignored here (tests/contracts.rs).

[advisories]
# Owner: Yuzora maintainers; review-by: 2027-03-31.
# rsa 0.9.10: production WebAuthn RS256 performs public-key signature
# verification ONLY; VAPID uses ES256. No RSA private-key signing/decryption in
# production. Test software authenticators use test-only RSA keys.
# Adding production private-key operations invalidates this exception.
#
# RUSTSEC-2026-0387: crypto-bigint 0.5.5 via webauthn_rp 0.3.0 -> p256 0.13.2 (ES256) /
# p384 0.13.1 (ES384) -> elliptic-curve 0.13. Production uses them ONLY to verify
# WebAuthn ES256/ES384 assertion signatures over public inputs (public keys, signatures, hashes); no
# secret scalars, signing or ECDH. SigningKey exists only in test authenticators.
# Reassess when webauthn_rp moves to p256 >=0.14 / crypto-bigint >=0.7.6, and
# immediately if production private-key operations are added.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.9.10 verification-only; owner: Yuzora maintainers; review-by: 2027-03-31; VAPID ES256" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 via p256 0.13.2 verification-only (WebAuthn ES256 over public inputs); owner: Yuzora maintainers; review-by: 2027-03-31; reassess at p256 >=0.14 / crypto-bigint >=0.7.6" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The first-party ../host path dependency is a workspace member without a version.
allow-wildcard-paths = true
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "aws-lc-rs" },
    { name = "aws-lc-sys" },
    { name = "aws-lc-fips-sys" },
    { name = "native-tls" },
]
