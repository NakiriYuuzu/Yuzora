# Scope: cargo-audit reads the whole workspace Cargo.lock and ignores by id
# only, so every id below applies to every member. The gateway-only advisory
# gate is cargo-deny with src-tauri/companion/deny.toml (two exceptions).

[advisories]
# RUSTSEC-2023-0071; rsa 0.9.10 (see Cargo.lock).
# Owner: Yuzora maintainers; review-by: 2027-03-31.
# Gateway: production only verifies WebAuthn RS256 signatures; VAPID uses ES256.
# No production RSA private-key operations. Test authenticators are test-only.
# Reassess immediately if private-key operations are added. The contract test
# supply_chain_exception_is_version_pinned_and_not_expired enforces the deadline.
# App: rsa 0.10.0-rc.18 through russh signs with the user's RSA key file during
# SSH authentication, a private-key operation this rationale does not cover.
# Keeping the app covered is pending the user's decision.
#
# RUSTSEC-2026-0387; crypto-bigint 0.5.5 via webauthn_rp 0.3.0 -> p256 0.13.2 (ES256) /
# p384 0.13.1 (ES384).
# Owner: Yuzora maintainers; review-by: 2027-03-31.
# Production only verifies WebAuthn ES256/ES384 assertion signatures over public
# inputs; no secret scalars, signing or ECDH. SigningKey is test-authenticator
# only. Reassess when webauthn_rp moves to p256 >=0.14 / crypto-bigint >=0.7.6,
# and immediately if production private-key operations are added.
#
# RUSTSEC-2026-0367/-0368/-0369; zip <9, app (Tauri) dependencies first audited
# when the crates merged into one workspace. Owner: Yuzora maintainers;
# review-by: 2027-03-31. The app's zip 8.6.0 only writes archives; the updater's
# zip 4.6.1 extracts signed Windows updates only. Rationale in deny.toml.
ignore = [
    "RUSTSEC-2023-0071",
    "RUSTSEC-2026-0387",
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]
