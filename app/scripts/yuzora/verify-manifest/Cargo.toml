# yuzora(release): checks a signed update manifest with the app's own code.
# It compiles src/yuzora/release/manifest.rs unchanged, so the release
# workflow accepts exactly what an installed app accepts, without building the
# app. Not part of the app's workspace on purpose (a separate lock, nothing
# here ships): scripts/yuzora/verify-manifest, docs/beta2/release.md.
[package]
name = "verify-manifest"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
base64 = "0.22"
minisign-verify = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
