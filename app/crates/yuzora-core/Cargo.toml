[package]
name = "yuzora-core"
description = "Yuzora's shared layer: app home, remote exec over hc, credentials, i18n, settings, mod discovery and the yuzora:core module."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui-shell = { path = "../../vendor/gpui-kit/crates/shell" }
async-channel = "2"
base64 = "0.22"
keyring = "4.1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"

[target.'cfg(unix)'.dependencies]
# killpg: a timed-out exec ends everything it started.
libc = "0.2"
