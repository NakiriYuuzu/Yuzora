[package]
name = "yuzora-git"
description = "Yuzora L2: Git, modelled on IntelliJ IDEA Community: status, staging, commit, branches, log graph, diff and merge."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Only crates already in app/Cargo.lock: the third-party set (and so
# THIRD-PARTY-NOTICES) stays as it is. The diff algorithms are our own.
[dependencies]
yuzora-core = { path = "../yuzora-core" }
# The editor's highlighter and palette: a diff's code is coloured as the editor colours the file.
yuzora-files = { path = "../yuzora-files" }
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui-base = { path = "../../vendor/gpui-kit/crates/base" }
async-channel = "2"
unicode-segmentation = "1.12"
notify = "7"
regex = "1"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Already in app/Cargo.lock: job objects end what git started (exec.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
