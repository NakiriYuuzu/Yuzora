# Workspace supply-chain policy: every member (app, Host, Companion gateway)
# and the single root Cargo.lock. Run from the repository root:
#   cargo deny --locked check
# Advisory ids are ignored for the whole graph, so the app's exceptions below
# would also hide a gateway hit. The gateway therefore has its own advisories
# gate (only its two reviewed exceptions) and native-TLS bans over its own
# subgraph, because the app's SSH stack (russh) still pulls aws-lc-rs; see
# src-tauri/companion/deny.toml. The app-wide bans wait for P11 (Tauri removal).

[advisories]
# Owner: Yuzora maintainers; review-by: 2027-03-31.
# RUSTSEC-2023-0071 (Marvin timing side channel; no patched rsa release).
# Gateway: rsa 0.9.10, production WebAuthn RS256 performs public-key signature
# verification ONLY; VAPID uses ES256. No RSA private-key signing/decryption in
# production. Test software authenticators use test-only RSA keys.
# Adding production private-key operations invalidates this exception.
# App: rsa 0.10.0-rc.18 through russh signs with the user's RSA key file during
# SSH authentication, a private-key operation the gateway rationale does not
# cover. Accepted risk (yuuzu, 2026-10-30): no patched rsa release exists, and
# dropping russh's rsa feature would break RSA keys and RSA-only hosts. Track
# RustCrypto/RSA#626; move to a patched rsa, or to ssh-agent signing, once one
# is available. Owner: yuuzu; review-by: 2027-03-31.
#
# RUSTSEC-2026-0387: crypto-bigint 0.5.5 via webauthn_rp 0.3.0 -> p256 0.13.2 (ES256) /
# p384 0.13.1 (ES384) -> elliptic-curve 0.13. Production uses them ONLY to verify
# WebAuthn ES256/ES384 assertion signatures over public inputs (public keys, signatures, hashes); no
# secret scalars, signing or ECDH. SigningKey exists only in test authenticators.
# Reassess when webauthn_rp moves to p256 >=0.14 / crypto-bigint >=0.7.6, and
# immediately if production private-key operations are added.
#
# App (Tauri) dependencies below were first audited when the crates merged into
# one workspace; none is in the Host or gateway subgraph. Approved by
# yuuzu on 2026-10-30; owner: yuuzu; review-by: 2027-03-31.
# RUSTSEC-2026-0367/-0368/-0369 (zip <9: SUID bits, symlink targets and
# permissions through symlinks during ZipArchive::extract). The app itself is on
# zip 9.1.3. The remaining hit is tauri-plugin-updater's zip 4.6.1, which
# extracts on Windows only, after the update signature check, and Yuzora
# publishes no zipped updater artifact. Drop these once the updater moves to
# zip >=9, or when Tauri leaves in P11.
# RUSTSEC-2024-0370 (proc-macro-error, unmaintained): build-time proc macro of
# the Linux GTK stack (glib-macros), no safe upgrade; leaves with Tauri (P11).
# RUSTSEC-2026-0370/-0371/-0372 (zvariant, zbus_names, zvariant_derive,
# unmaintained as standalone crates): Linux D-Bus through zbus 5 (notifications,
# opener, single instance, secret-service keyring), no safe upgrade yet.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "gateway: rsa 0.9.10 verification-only (VAPID ES256); app: russh rsa 0.10.0-rc.18 SSH private-key signing, accepted risk (yuuzu 2026-10-30; no patched release, track RustCrypto/RSA#626); owner: Yuzora maintainers; review-by: 2027-03-31" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 via p256 0.13.2 verification-only (WebAuthn ES256 over public inputs); owner: Yuzora maintainers; review-by: 2027-03-31; reassess at p256 >=0.14 / crypto-bigint >=0.7.6" },
    { id = "RUSTSEC-2026-0367", reason = "updater zip 4.6.1 extracts signed Windows updates only (the app is on zip 9.1.3); owner: yuuzu; review-by: 2027-03-31; drop when the updater moves to zip >=9" },
    { id = "RUSTSEC-2026-0368", reason = "updater zip 4.6.1 extracts signed Windows updates only (the app is on zip 9.1.3); owner: yuuzu; review-by: 2027-03-31; drop when the updater moves to zip >=9" },
    { id = "RUSTSEC-2026-0369", reason = "updater zip 4.6.1 extracts signed Windows updates only (the app is on zip 9.1.3); owner: yuuzu; review-by: 2027-03-31; drop when the updater moves to zip >=9" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error 1.0.4 unmaintained, Linux GTK build-time macro, no safe upgrade; owner: yuuzu; review-by: 2027-03-31; leaves with Tauri (P11)" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant 5 unmaintained as a standalone crate, Linux D-Bus via zbus 5, no safe upgrade; owner: yuuzu; review-by: 2027-03-31" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names 4 unmaintained as a standalone crate, Linux D-Bus via zbus 5, no safe upgrade; owner: yuuzu; review-by: 2027-03-31" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5 unmaintained as a standalone crate, Linux D-Bus via zbus 5, no safe upgrade; owner: yuuzu; review-by: 2027-03-31" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "OpenSSL", "0BSD", "CC0-1.0", "CDLA-Permissive-2.0"]
# Private first-party workspace crates are not distributed as third-party code.
private = { ignore = true }
confidence-threshold = 0.8
# Existing yuzora-host -> dirs -> dirs-sys -> option-ext, unchanged crate.
# MPL is file-level copyleft; this exception is NOT a blanket MPL allowance.
# Phase 8 packaging must include MPL-2.0 notice and source availability details.
#
# The other exceptions are existing app (Tauri) dependencies, pinned to the
# shipped versions: tauri-utils -> dom_query -> cssparser / selectors (MPL-2.0)
# and arboard -> clipboard-win -> error-code (BSL-1.0, Windows). Neither
# license is allowed globally; a version change requires review, and the
# MPL-2.0 notice and source availability apply to them as well. Approved by
# yuuzu on 2026-10-30.
exceptions = [
    { name = "option-ext", version = "=0.2.0", allow = ["MPL-2.0"] },
    { name = "cssparser", version = "=0.37.0", allow = ["MPL-2.0"] },
    { name = "cssparser-macros", version = "=0.7.1", allow = ["MPL-2.0"] },
    { name = "dtoa-short", version = "=0.3.5", allow = ["MPL-2.0"] },
    { name = "selectors", version = "=0.38.0", allow = ["MPL-2.0"] },
    { name = "clipboard-win", version = "=5.4.1", allow = ["BSL-1.0"] },
    { name = "error-code", version = "=3.4.0", allow = ["BSL-1.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# First-party path dependencies inside the workspace (yuzora-host) carry no
# version; every member is `publish = false`.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
