# The website in site/, the two changelogs and site-remotion's dependency
# versions: lint and tests on every change to them, and the GitHub Pages
# deployment from main. The pages a push to main publishes are the ones its
# tests just read, built once.
#
# site/en/ and site/sitemap.xml are generated here (site:seo); everything else
# under site/ is published as committed.
name: Site

on:
  push:
    branches: [main]
    paths: &site-paths
      - 'site/**'
      - 'tests/*.js'
      - 'scripts/generate-site-pages.mjs'
      - 'site-remotion/package.json'
      - 'eslint.config.js'
      - 'CHANGELOG.md'
      - 'CHANGELOG.zh-TW.md'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/site.yml'
  pull_request:
    paths: *site-paths
  # From main: publishes it again without a change to the site. From another
  # branch: the checks only.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Site (test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run lint
      - run: bun run site:seo
      - run: bun run test
      - name: Keep the tested pages for the deployment
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy Pages
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
