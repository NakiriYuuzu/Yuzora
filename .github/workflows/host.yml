name: Host helper artifacts

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source-ref:
        required: false
        type: string
        default: ''
      caller:
        # Callers name themselves so the direct pull_request trigger can skip
        # release PRs, whose helpers CI already builds through this workflow.
        required: false
        type: string
        default: ''
  pull_request:
    paths:
      - 'src-tauri/host/**'
      - 'src-tauri/herdr-runtime.json'
      - 'src-tauri/vendor/tiberius-0.12.3-yuzora/**'
      - 'scripts/prepare-host-resources*'
      - 'scripts/prepare-herdr-resources*'
      - 'scripts/verify-herdr-runtime.ts'
      - '.github/workflows/host.yml'

permissions:
  contents: read

jobs:
  build:
    # Stable release recovery matches these exact names; extra matrix values must not change them.
    name: build (${{ matrix.runner }}, ${{ matrix.target }})
    if: ${{ inputs.caller != '' || github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release/') }}
    # A newer push cancels a superseded pull_request run per target; called
    # runs get a unique group and follow their caller's cancellation.
    concurrency:
      group: ${{ inputs.caller == '' && github.event_name == 'pull_request' && format('host-pr-{0}-{1}', github.ref, matrix.target) || format('host-{0}-{1}', github.run_id, matrix.target) }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
          - runner: macos-15
            target: macos-aarch64
          - runner: macos-15-intel
            target: macos-x86_64
          - runner: windows-latest
            target: windows-x86_64
            executable-suffix: .exe
    timeout-minutes: 45
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      # Swatinem/rust-cache@v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri/host
          key: host-${{ matrix.target }}
          cache-on-failure: true
      - run: cargo fmt --manifest-path src-tauri/host/Cargo.toml -- --check
      - run: cargo clippy --locked --all-targets --manifest-path src-tauri/host/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/host/Cargo.toml
      - run: bun scripts/prepare-host-resources.ts ${{ matrix.target }}
      - name: Verify isolated HERDR runtime contract
        timeout-minutes: 3
        run: bun scripts/verify-herdr-runtime.ts src-tauri/resources/host/${{ matrix.target }}/herdr${{ matrix.executable-suffix }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-${{ matrix.target }}
          path: src-tauri/resources/host/
          if-no-files-found: error
