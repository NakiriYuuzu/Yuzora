name: Host helper artifacts

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source-ref:
        required: false
        type: string
        default: ''
  pull_request:
    paths:
      - 'src-tauri/host/**'
      - 'src-tauri/vendor/tiberius-0.12.3-yuzora/**'
      - 'scripts/prepare-host-resources*'
      - 'scripts/prepare-herdr-resources*'
      - '.github/workflows/host.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
          - runner: macos-14
            target: macos-aarch64
          - runner: macos-15-intel
            target: macos-x86_64
    timeout-minutes: 45
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path src-tauri/host/Cargo.toml -- --check
      - run: cargo clippy --locked --all-targets --manifest-path src-tauri/host/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/host/Cargo.toml
      - run: bun scripts/prepare-host-resources.ts ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: host-${{ matrix.target }}
          path: src-tauri/resources/host/
          if-no-files-found: error
