name: Companion gateway

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src-tauri/companion/**'
      - 'src-tauri/host/**'
      - 'src-tauri/vendor/tiberius-0.12.3-yuzora/**'
      - '.github/workflows/companion.yml'

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/companion-target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path src-tauri/companion/Cargo.toml -- --check
      - run: cargo clippy --locked --all-targets --manifest-path src-tauri/companion/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/companion/Cargo.toml
      - name: Reject native TLS dependencies
        shell: bash
        run: |
          set -euo pipefail
          for p in openssl openssl-sys aws-lc-sys aws-lc-rs native-tls; do
            if output=$(cargo tree --locked --manifest-path src-tauri/companion/Cargo.toml -i "$p" 2>&1); then
              printf '%s\n' "$output"
              exit 1
            fi
            printf '%s\n' "$output"
            grep -F 'did not match any packages' <<< "$output"
          done

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/companion-target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
      - name: Install pinned supply-chain tools
        run: |
          cargo install --locked --root "$RUNNER_TEMP/yzc-tools" cargo-deny --version 0.20.2
          cargo install --locked --root "$RUNNER_TEMP/yzc-tools" cargo-audit --version 0.22.2
      - name: Deny licenses, banned packages, advisories and sources
        working-directory: src-tauri/companion
        run: '"$RUNNER_TEMP/yzc-tools/bin/cargo-deny" --locked check'
      - name: Audit (documented RSA verification-only exception)
        working-directory: src-tauri/companion
        run: '"$RUNNER_TEMP/yzc-tools/bin/cargo-audit" audit'
