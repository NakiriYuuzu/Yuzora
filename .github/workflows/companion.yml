name: Companion gateway

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src-tauri/companion/**'
      - 'src-tauri/companion-net/**'
      - 'src-tauri/host/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - '.cargo/**'
      - 'src-tauri/vendor/tiberius-0.12.3-yuzora/**'
      - 'src-tauri/vendor/portable-pty-0.9.0-yuzora/**'
      - '.github/workflows/companion.yml'

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/companion-target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: cargo fmt -p yuzora-companion -- --check
      - run: cargo clippy --locked --all-targets -p yuzora-companion -- -D warnings
      - run: cargo test --locked -p yuzora-companion
        env:
          RUST_BACKTRACE: 1
      - name: Reject native TLS dependencies
        shell: bash
        run: |
          set -euo pipefail
          for p in openssl openssl-sys aws-lc-sys aws-lc-rs native-tls; do
            if output=$(cargo tree --locked -p yuzora-companion -i "$p" 2>&1); then
              printf '%s\n' "$output"
              exit 1
            fi
            printf '%s\n' "$output"
            grep -F 'did not match any packages' <<< "$output"
          done

  net:
    name: net (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      # The shipped sidecar is built without cgo, so vet and test that build.
      CGO_ENABLED: '0'
    steps:
      # gofmt rejects the CRLF line endings a default Windows checkout produces.
      - name: Keep LF line endings
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src-tauri/companion-net/go.mod
          cache-dependency-path: src-tauri/companion-net/go.sum
      - name: gofmt
        shell: bash
        working-directory: src-tauri/companion-net
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'gofmt would change:\n%s\n' "$unformatted"
            exit 1
          fi
      - run: go vet ./...
        working-directory: src-tauri/companion-net
      - run: go test ./...
        working-directory: src-tauri/companion-net
      # The sidecar terminates TLS for tailnet peers, so a reachable advisory in
      # the Go standard library or a dependency fails the job (exit 3). The
      # tags are the ones the shipped binary is built with.
      - name: govulncheck
        shell: bash
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/yzc-go-tools" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          cd src-tauri/companion-net
          "$RUNNER_TEMP/yzc-go-tools/govulncheck" -tags ts_omit_webclient ./...

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/companion-target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1
      - name: Install pinned supply-chain tools
        run: |
          cargo install --locked --root "$RUNNER_TEMP/yzc-tools" cargo-deny --version 0.20.2
          cargo install --locked --root "$RUNNER_TEMP/yzc-tools" cargo-audit --version 0.22.2
      # The workspace shares one Cargo.lock. The root check covers every member
      # with the app's exceptions; the gateway check sees only the gateway
      # subgraph with its own two advisory exceptions and native-TLS bans.
      - name: Deny licenses, banned packages, advisories and sources (workspace)
        run: '"$RUNNER_TEMP/yzc-tools/bin/cargo-deny" --locked check'
      - name: Deny advisories and native TLS packages in the gateway subgraph
        run: '"$RUNNER_TEMP/yzc-tools/bin/cargo-deny" --locked --manifest-path src-tauri/companion/Cargo.toml --config src-tauri/companion/deny.toml check advisories bans'
      # cargo-audit reads the whole lock and ignores by id only.
      - name: Audit the workspace lock (documented exceptions in .cargo/audit.toml)
        run: '"$RUNNER_TEMP/yzc-tools/bin/cargo-audit" audit'
