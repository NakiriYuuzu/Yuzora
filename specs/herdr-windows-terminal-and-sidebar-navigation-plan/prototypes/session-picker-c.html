<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session picker · C 步驟式</title>
<style>
:root{
  --paper-0:#ffffff;--paper-1:#fbfaf6;--paper-2:#f4f1ea;
  --ink-1:#2e2c28;--ink-2:#57534b;--ink-3:#8a857a;
  --line-1:rgba(27,26,23,.10);--line-2:rgba(27,26,23,.16);
  --accent:#86b81f;--accent-ink:#5f8c1e;--accent-soft:rgba(134,184,31,.14);
  --run:#f5820a;--danger:#e23b54;--ok:#1f8a5b;
  --hover:rgba(255,255,255,.45);--active:rgba(255,255,255,.78);--sunk:rgba(244,241,234,.5);--field:rgba(255,255,255,.62);
  --bg:radial-gradient(125% 120% at 0% 0%,#e9f4c8 0%,transparent 46%),radial-gradient(120% 115% at 100% 2%,#cdeed3 0%,transparent 50%),radial-gradient(125% 130% at 96% 100%,#c4dbf6 0%,transparent 54%),radial-gradient(120% 120% at 8% 100%,#f6e6c8 0%,transparent 48%),#f6f5ef;
  --shadow-xl:0 32px 70px rgba(27,26,23,.18),0 8px 22px rgba(27,26,23,.10);
  --shadow-xs:0 1px 2px rgba(27,26,23,.06);
  --sans:"Hanken Grotesk","Segoe UI",-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --serif:"Newsreader",Georgia,"Songti TC",serif;
}
.dark{
  --paper-0:#201f26;--paper-1:#1a191f;--paper-2:#141318;
  --ink-1:#e7e4df;--ink-2:#b6b2bb;--ink-3:#8a8691;
  --line-1:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.16);
  --accent-soft:rgba(134,184,31,.18);--accent-ink:#a9d45a;
  --hover:rgba(255,255,255,.05);--active:rgba(255,255,255,.10);--sunk:rgba(255,255,255,.03);--field:rgba(255,255,255,.06);
  --bg:radial-gradient(125% 120% at 0% 0%,#232c18 0%,transparent 46%),radial-gradient(120% 115% at 100% 2%,#15261d 0%,transparent 50%),radial-gradient(125% 130% at 96% 100%,#182236 0%,transparent 54%),radial-gradient(120% 120% at 8% 100%,#2a2017 0%,transparent 48%),#100f14;
  --shadow-xl:0 32px 70px rgba(0,0,0,.62),0 8px 22px rgba(0,0,0,.45);
  --ok:#74d6a0;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.5 var(--sans);color:var(--ink-1);background:var(--bg);overflow:hidden}
button,input,select{font:inherit;color:inherit}
.scrim{position:fixed;inset:0;background:rgba(20,19,24,.28);display:flex;align-items:flex-start;justify-content:center;padding:9vh 16px 16px}
.dark .scrim{background:rgba(0,0,0,.45)}
.dlg{position:relative;display:flex;flex-direction:column;width:min(680px,100%);max-height:calc(100dvh - 12vh - 16px);background:var(--paper-1);border:1px solid var(--line-2);border-radius:16px;box-shadow:var(--shadow-xl);overflow:hidden}
.dlg:focus{outline:none}
.dlg-head{padding:18px 20px 12px;display:flex;align-items:flex-start;gap:12px}
.dlg-head h1{margin:0;font:500 19px/1.3 var(--serif)}
.dlg-head p{margin:3px 0 0;color:var(--ink-2);font-size:12.5px}
.icon-btn{margin-left:auto;display:inline-grid;place-items:center;width:28px;height:28px;border:0;border-radius:8px;background:transparent;color:var(--ink-2);cursor:pointer}
.icon-btn:hover{background:var(--hover);color:var(--ink-1)}
.dlg-foot{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line-1);background:var(--sunk)}
.foot-hint{flex:1;min-width:0;font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--paper-0);cursor:pointer;font-size:12.5px;font-weight:500}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--ink-1);color:var(--paper-1);border-color:transparent}
.dark .btn.primary{background:#e7e4df;color:#1a191f}
.btn.primary:hover{opacity:.9}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent}
.btn:focus-visible,.icon-btn:focus-visible,.row:focus-visible,.src:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink-2);outline-offset:1px}
kbd{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 4px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;background:var(--paper-0);font:500 10.5px var(--mono);color:var(--ink-2)}
.badge{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:500;background:var(--sunk);border:1px solid var(--line-1);color:var(--ink-2);white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.badge.run{color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent);border-color:transparent}
.badge.stop{color:var(--ink-3)}
.badge.loaded{color:var(--accent-ink);background:var(--accent-soft);border-color:transparent}
.badge.loaded::before{display:none}
.badge.warn{color:var(--run);background:color-mix(in srgb,var(--run) 10%,transparent);border-color:transparent}
.badge.err{color:var(--danger);background:color-mix(in srgb,var(--danger) 9%,transparent);border-color:transparent}
.mono{font-family:var(--mono)}
.row{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent;outline:none}
.row:hover{background:var(--hover)}
.row[aria-selected="true"]{background:var(--active);border-color:var(--line-2);box-shadow:var(--shadow-xs)}
.row[aria-disabled="true"]{cursor:not-allowed}
.row[aria-disabled="true"] .row-title{color:var(--ink-3)}
.row-main{flex:1;min-width:0}
.row-title{font:500 13px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:11.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glyph{display:grid;place-items:center;flex-shrink:0;width:28px;height:28px;border-radius:8px;border:1px solid var(--line-2);background:var(--paper-0);font:600 10px var(--mono);color:var(--ink-2)}
.note{margin:0;padding:10px 12px;border-radius:10px;background:var(--sunk);border:1px solid var(--line-1);font-size:12px;color:var(--ink-2)}
.note.err{background:color-mix(in srgb,var(--danger) 7%,var(--paper-1));border-color:color-mix(in srgb,var(--danger) 25%,transparent);color:var(--ink-1)}
.note strong{color:var(--ink-1)}
.note .actions{display:flex;gap:6px;margin-top:8px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:500}
.field .help{font-size:11.5px;color:var(--ink-2)}
.seg{display:inline-flex;padding:2px;border-radius:9px;background:var(--sunk);border:1px solid var(--line-1)}
.seg button{height:26px;padding:0 10px;border:0;border-radius:7px;background:transparent;font-size:12px;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--paper-0);color:var(--ink-1);box-shadow:var(--shadow-xs)}
input.text{height:32px;padding:0 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--field)}
.skel{height:44px;border-radius:10px;background:linear-gradient(90deg,var(--sunk),var(--hover),var(--sunk));background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.spin{width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--paper-0);border:1px solid var(--line-2);box-shadow:var(--shadow-xl);font-size:12.5px}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:18px 12px}
.empty h3{margin:0;font:500 14px var(--sans)}
.empty p{margin:0;color:var(--ink-2);font-size:12.5px;max-width:52ch}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tweaks{position:fixed;right:14px;bottom:14px;width:236px;padding:10px 12px;border-radius:12px;background:var(--paper-0);border:1px solid var(--line-2);box-shadow:var(--shadow-xl);font-size:12px;z-index:10}
.tweaks summary{cursor:pointer;font-weight:600}
.tweaks .t-row{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.tweaks select{height:28px;border:1px solid var(--line-2);border-radius:7px;background:var(--field);padding:0 6px}
.tweaks .t-note{margin-top:8px;color:var(--ink-3);font-size:11px}
.variant-tag{position:fixed;left:14px;bottom:14px;padding:6px 10px;border-radius:999px;background:var(--paper-0);border:1px solid var(--line-2);font-size:11.5px;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){.skel,.spin{animation:none}}

.dlg{width:min(640px,100%)}
.steps{display:flex;gap:6px;margin:0 20px 12px;padding:0;list-style:none}
.steps li{flex:1;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--sunk);border:1px solid var(--line-1);font-size:12px;color:var(--ink-3)}
.steps li .n{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1px solid var(--line-2);font:600 11px var(--mono)}
.steps li[aria-current="step"]{background:var(--paper-0);color:var(--ink-1);border-color:var(--line-2);box-shadow:var(--shadow-xs)}
.steps li[data-done="true"]{color:var(--ink-2)}
.steps li[data-done="true"] .n{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
.step-body{min-height:0;overflow:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line-1);padding-top:14px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border-radius:12px;border:1px solid var(--line-2);background:var(--paper-0);text-align:left;cursor:pointer}
.choice:hover{background:var(--hover)}
.choice[aria-pressed="true"]{border-color:var(--ink-2);box-shadow:var(--shadow-xs)}
.choice strong{font-size:13.5px}
.choice small{color:var(--ink-2);font-size:11.5px}
[role=listbox]{display:flex;flex-direction:column;gap:2px;outline:none}
</style>
</head>
<body>
<div id="root"></div>
<div class="variant-tag">C · 探索：三步驟精靈</div>
<script>

// Placeholder data for the prototype only (not product claims).
const DATA = {
  sessions: [
    { id: "local:default", name: "default", host: "local", hostLabel: "本機", kind: "local", status: "running", loaded: true, spaces: 4, agents: 3 },
    { id: "local:review", name: "review", host: "local", hostLabel: "本機", kind: "local", status: "running", loaded: false, spaces: 1, agents: 1 },
    { id: "local:nightly", name: "nightly", host: "local", hostLabel: "本機", kind: "local", status: "stopped", loaded: false },
    { id: "dev:default", name: "default", host: "dev", hostLabel: "dev-box", kind: "ssh", status: "running", loaded: false, spaces: 2, agents: 2 },
    { id: "dev:ci", name: "ci", host: "dev", hostLabel: "dev-box", kind: "ssh", status: "running", loaded: false, spaces: 1, agents: 0 },
    { id: "ubuntu:default", name: "default", host: "ubuntu", hostLabel: "Ubuntu-24.04", kind: "wsl", status: "running", loaded: false, spaces: 2, agents: 1 },
  ],
  hosts: [
    { id: "local", label: "本機", kind: "local", detail: "原生 Herdr 0.9.1", conn: "ready" },
    { id: "dev", label: "dev-box", kind: "ssh", detail: "yuuzu@10.0.0.12", conn: "ready" },
    { id: "build", label: "build-server", kind: "ssh", detail: "ci@build.internal", conn: "disconnected" },
    { id: "ubuntu", label: "Ubuntu-24.04", kind: "wsl", detail: "WSL2", conn: "ready" },
    { id: "debian", label: "Debian", kind: "wsl", detail: "WSL1 · 不支援", conn: "unsupported" },
  ],
};
const STATES = {
  default: "一般",
  loading: "重新整理中",
  empty: "沒有執行中的 Session",
  disconnected: "SSH 主機未連線",
  setup: "WSL 需要設定 runtime",
  incompatible: "runtime 不相容",
  submitting: "載入中",
  success: "載入成功",
};
function tweaksHtml(current, platform, theme) {
  const opts = Object.entries(STATES).map(([k, v]) => `<option value="${k}" ${k === current ? "selected" : ""}>${v}</option>`).join("");
  return `<details class="tweaks" open><summary>Tweaks（原型控制）</summary>
    <div class="t-row"><label for="t-state">狀態</label><select id="t-state">${opts}</select></div>
    <div class="t-row"><label for="t-platform">平台</label><select id="t-platform">
      <option value="windows" ${platform === "windows" ? "selected" : ""}>Windows（顯示 WSL）</option>
      <option value="mac" ${platform === "mac" ? "selected" : ""}>macOS</option></select></div>
    <div class="t-row"><label for="t-theme">主題</label><select id="t-theme">
      <option value="light" ${theme === "light" ? "selected" : ""}>淺色</option>
      <option value="dark" ${theme === "dark" ? "selected" : ""}>深色</option></select></div>
    <div class="t-note">資料為示意。鍵盤：↑↓ 選擇 · Enter 載入 · Esc 關閉。</div></details>`;
}
function bindTweaks(app) {
  document.getElementById("t-state").onchange = (e) => { app.state = e.target.value; app.reset(); };
  document.getElementById("t-platform").onchange = (e) => { app.platform = e.target.value; app.reset(); };
  document.getElementById("t-theme").onchange = (e) => { app.theme = e.target.value; app.applyTheme(); app.persist(); };
}
function persisted(key) {
  try { return JSON.parse(localStorage.getItem(key) || "{}"); } catch { return {}; }
}
const ICON = {
  close: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  refresh: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg>',
  search: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  check: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
};
const glyph = (kind) => kind === "ssh" ? "SSH" : kind === "wsl" ? "WSL" : "本機";
function statusBadge(s) {
  if (s.loaded) return '<span class="badge loaded">已在側邊欄</span>';
  return s.status === "running" ? '<span class="badge run">執行中</span>' : '<span class="badge stop">已停止</span>';
}
function sessionMeta(s) {
  if (s.status !== "running") return "已停止 · 到 HERDR 工具 → Sessions 啟動";
  return `${s.hostLabel} · ${s.spaces} 個 Space · ${s.agents} 個 Agent`;
}
/** Visible sessions for a prototype state (placeholder data). */
function sessionsFor(state, platform) {
  let list = DATA.sessions.filter((s) => platform === "windows" || s.kind !== "wsl");
  if (state === "empty") list = list.map((s) => ({ ...s, status: "stopped", loaded: false }));
  return list;
}
function selectable(s) { return s.status === "running" && !s.loaded; }
/** Shared app shell: state, theme, persistence and keyboard helpers. */
function createApp(key, render) {
  const saved = persisted(key);
  const app = {
    state: saved.state || "default", platform: saved.platform || "windows", theme: saved.theme || "light",
    persist() { localStorage.setItem(key, JSON.stringify({ state: app.state, platform: app.platform, theme: app.theme })); },
    applyTheme() { document.documentElement.classList.toggle("dark", app.theme === "dark"); },
    reset() { app.persist(); app.local = {}; render(app); },
    local: {},
  };
  app.applyTheme();
  return app;
}


function listboxKeys(app, listEl, items, onLoad) {
  listEl.onkeydown = (e) => {
    const enabled = items.filter(selectable);
    if (!enabled.length) return;
    let i = enabled.findIndex((s) => s.id === app.local.selected);
    if (e.key === "ArrowDown") { i = Math.min(enabled.length - 1, i + 1); }
    else if (e.key === "ArrowUp") { i = Math.max(0, i - 1); }
    else if (e.key === "Home") { i = 0; }
    else if (e.key === "End") { i = enabled.length - 1; }
    else if (e.key === "Enter") { e.preventDefault(); onLoad(); return; }
    else return;
    e.preventDefault();
    app.local.selected = enabled[Math.max(0, i)].id;
    app.render();
    document.getElementById("list")?.focus();
  };
}
function sessionRows(app, items) {
  return items.map((s) => `
    <div class="row" role="option" id="opt-${s.id}" data-id="${s.id}" aria-selected="${app.local.selected === s.id}" aria-disabled="${!selectable(s)}">
      <span class="glyph">${glyph(s.kind)}</span>
      <div class="row-main"><div class="row-title">${s.name}</div><div class="row-sub">${sessionMeta(s)}</div></div>
      ${statusBadge(s)}
    </div>`).join("");
}
function bindRows(app, onLoad) {
  document.querySelectorAll(".row[data-id]").forEach((row) => {
    const s = DATA.sessions.find((x) => x.id === row.dataset.id);
    row.onclick = () => { if (!selectable(s)) return; app.local.selected = s.id; app.render(); document.getElementById("list")?.focus(); };
    row.ondblclick = () => { if (!selectable(s)) return; app.local.selected = s.id; onLoad(); };
  });
}
function loadSelected(app) {
  const s = DATA.sessions.find((x) => x.id === app.local.selected);
  if (!s || app.state === "incompatible") return;
  app.local.submitting = true; app.render();
  setTimeout(() => { app.local.submitting = false; app.local.closed = s; app.render(); }, 900);
}
function closedView(app) {
  const s = app.local.closed;
  return `${s && s.id ? `<div class="toast" role="status">${ICON.check}<span>已載入 <span class="mono">${s.name}</span> · ${s.hostLabel}，側邊欄已切換到這個 Session。</span></div>` : ""}
    <div style="position:fixed;inset:0;display:grid;place-items:center"><button class="btn" id="reopen">重新開啟對話框</button></div>`;
}
function footHint(app, selected) {
  if (app.state === "incompatible") return '<span class="foot-hint">此主機的 runtime 不相容，修復後才能載入。</span>';
  if (app.state === "empty") return '<span class="foot-hint">沒有可載入的 Session。</span>';
  if (!selected) return '<span class="foot-hint">選擇一個執行中的 Session 以載入。</span>';
  return `<span class="foot-hint">將載入 <span class="mono">${selected.name}</span> · ${selected.hostLabel}　<kbd>Enter</kbd></span>`;
}
function loadButton(app, selected) {
  const busy = app.local.submitting || app.state === "submitting";
  return `<button class="btn primary" id="load" ${!selected || busy || app.state === "incompatible" ? "disabled" : ""}>${busy ? '<span class="spin"></span>載入中…' : "載入 Session"}</button>`;
}
function refreshButton(app) {
  const busy = app.state === "loading";
  return `<button class="btn ghost" id="refresh" ${busy ? "disabled" : ""}>${busy ? '<span class="spin"></span>' : ICON.refresh}重新整理</button>`;
}
function incompatibleNote() {
  return `<div class="note err"><strong>dev-box 的 runtime 不相容</strong><br>Client 0.8.2（protocol 20）與 server 0.9.1（protocol 22）不一致。先修復主機，再重新整理。
    <div class="actions"><button class="btn">修復主機</button><button class="btn ghost">複製診斷</button></div></div>`;
}
function emptyBlock() {
  return `<div class="empty"><h3>沒有執行中的 Session</h3><p>已停止的 Session 不能直接載入。到「HERDR 工具 → Sessions」啟動後再重新整理。</p>
    <div style="display:flex;gap:6px"><button class="btn">開啟 HERDR 工具</button><button class="btn ghost">${ICON.refresh}重新整理</button></div></div>`;
}
function setupBlock(host) {
  return `<div class="field"><label>Runtime 來源</label>
      <div class="seg" role="group" aria-label="Runtime 來源"><button aria-pressed="true">Yuzora 管理</button><button aria-pressed="false">主機已安裝</button><button aria-pressed="false">自訂路徑</button></div>
      <span class="help">${host} 尚未設定 Herdr runtime。Yuzora 會部署固定版本的 helper 與 Herdr，不會停止主機上已執行的 server。</span></div>
    <div><button class="btn primary" id="setup">設定並連線</button></div>`;
}

const app = createApp("yz-proto-c", render);
app.render = () => render(app);
function render(app) {
  const root = document.getElementById("root");
  if (app.local.closed) { root.innerHTML = closedView(app) + tweaksHtml(app.state, app.platform, app.theme); document.getElementById("reopen").onclick = () => app.reset(); bindTweaks(app); return; }
  if (!app.local.source) { app.local.source = app.state === "disconnected" ? "ssh" : app.state === "setup" ? "wsl" : "local"; app.local.step = app.local.source === "local" ? 3 : 2; }
  const src = app.local.source, step = app.local.step;
  const all = sessionsFor(app.state, app.platform);
  const sources = [["local", "本機", "這台電腦上的 Herdr"], ["ssh", "SSH 主機", "透過 SSH 連線的遠端主機"], ...(app.platform === "windows" ? [["wsl", "WSL", "已啟用的 WSL2 發行版"]] : [])];
  app.local.host ??= src === "ssh" ? (app.state === "disconnected" ? "build" : "dev") : src === "wsl" ? "ubuntu" : "local";
  const host = DATA.hosts.find((h) => h.id === app.local.host);
  const conn = app.state === "disconnected" && host.id === "build" ? "disconnected" : app.state === "setup" && host.id === "ubuntu" ? "setup" : host.conn;
  let body = "", items = [];
  if (step === 1) {
    body = `<div class="choices">${sources.map(([k, v, d]) => `<button class="choice" data-src="${k}" aria-pressed="${src === k}"><span class="glyph">${glyph(k)}</span><strong>${v}</strong><small>${d}</small></button>`).join("")}</div>`;
  } else if (step === 2) {
    const hosts = DATA.hosts.filter((h) => h.kind === src);
    body = `<div role="listbox" aria-label="主機">${hosts.map((h) => `<div class="row" data-host="${h.id}" aria-selected="${h.id === host.id}" aria-disabled="${h.conn === "unsupported"}"><span class="glyph">${glyph(h.kind)}</span><div class="row-main"><div class="row-title">${h.label}</div><div class="row-sub">${h.detail}</div></div>
      ${h.conn === "unsupported" ? '<span class="badge stop">不支援</span>' : (h.id === "build") ? '<span class="badge warn">未連線</span>' : (h.id === "ubuntu" && app.state === "setup") ? '<span class="badge warn">需要設定</span>' : '<span class="badge run">已連線</span>'}</div>`).join("")}</div>`;
    if (conn === "disconnected") body += `<div class="note"><strong>${host.label} 尚未連線。</strong> 連線成功後才能進入下一步。<div class="actions"><button class="btn primary" id="connect">連線</button><button class="btn ghost">管理主機</button></div></div>`;
    if (conn === "setup") body += `<div class="note" style="display:flex;flex-direction:column;gap:10px">${setupBlock(host.label)}</div>`;
    if (src === "ssh") body += '<button class="btn ghost" style="align-self:flex-start">＋ 新增 SSH 主機</button>';
  } else {
    items = all.filter((s) => s.host === host.id);
    if (app.state === "incompatible") body += incompatibleNote();
    if (app.state === "loading") body += '<div class="skel"></div><div class="skel"></div>';
    else if (app.state === "empty") body += emptyBlock();
    else body += `<div role="listbox" id="list" tabindex="0" aria-label="${host.label} Sessions">${sessionRows(app, items)}</div>`;
  }
  const selected = step === 3 ? DATA.sessions.find((s) => s.id === app.local.selected && items.some((x) => x.id === s.id)) : null;
  const canNext = step === 1 || (step === 2 && conn === "ready");
  const labels = ["來源", "主機與 runtime", "Session"];
  root.innerHTML = `<div class="scrim"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="t" tabindex="-1">
    <div class="dlg-head"><div><h1 id="t">加入 Herdr Session</h1><p>三個步驟：選來源、準備主機、選 Session。本機來源會直接跳到第 3 步。</p></div><button class="icon-btn" aria-label="關閉" id="close">${ICON.close}</button></div>
    <ol class="steps">${labels.map((l, i) => `<li ${i + 1 === step ? 'aria-current="step"' : ""} data-done="${i + 1 < step}"><span class="n">${i + 1 < step ? "✓" : i + 1}</span>${l}${i === 1 && src === "local" ? "（略過）" : ""}</li>`).join("")}</ol>
    <div class="step-body">${body}</div>
    <div class="dlg-foot">${step > 1 ? '<button class="btn ghost" id="back">上一步</button>' : ""}${step === 3 ? footHint(app, selected) : '<span class="foot-hint">' + (step === 1 ? "選擇 Session 所在的位置。" : conn === "ready" ? `${host.label} 已就緒。` : "完成主機準備後才能繼續。") + "</span>"}
      ${step === 3 ? refreshButton(app) + loadButton(app, selected) : `<button class="btn primary" id="next" ${canNext ? "" : "disabled"}>下一步</button>`}</div></div></div>` + tweaksHtml(app.state, app.platform, app.theme);
  bindTweaks(app);
  document.querySelectorAll("[data-src]").forEach((b) => b.onclick = () => { app.local.source = b.dataset.src; app.local.host = undefined; app.render(); });
  document.querySelectorAll("[data-host]").forEach((r) => r.onclick = () => { if (r.getAttribute("aria-disabled") === "true") return; app.local.host = r.dataset.host; app.render(); });
  document.getElementById("next")?.addEventListener("click", () => { app.local.step = step === 1 && app.local.source === "local" ? 3 : step + 1; app.render(); });
  document.getElementById("back")?.addEventListener("click", () => { app.local.step = step === 3 && src === "local" ? 1 : step - 1; app.render(); });
  document.getElementById("connect")?.addEventListener("click", () => { app.state = "default"; app.local.host = "dev"; app.render(); });
  document.getElementById("setup")?.addEventListener("click", () => { app.state = "default"; app.render(); });
  document.getElementById("close").onclick = () => { app.local.closed = {}; app.render(); };
  document.getElementById("load")?.addEventListener("click", () => loadSelected(app));
  const list = document.getElementById("list");
  if (list) { listboxKeys(app, list, items, () => loadSelected(app)); bindRows(app, () => loadSelected(app)); }
  document.querySelector(".dlg").onkeydown = (e) => { if (e.key === "Escape") { app.local.closed = {}; app.render(); } };
}
render(app);

</script>
</body>
</html>
